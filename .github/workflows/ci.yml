name: CI

permissions:
  pull-requests: write

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for case-only path collisions
        run: node scripts/check-case-collisions.mjs

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

  test:
    name: Test (React ${{ matrix.react-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react-version: ["18", "19"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install React ${{ matrix.react-version }}
        if: matrix.react-version == '19'
        run: npm install react@19 react-dom@19 @types/react@19 @types/react-dom@19 --no-save --legacy-peer-deps

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build:
    name: Build & bundle size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - name: Check bundle size
        run: npm run size

      - name: Build
        run: npm run build

      - name: Check for duplicate exports in barrel
        run: node scripts/check-duplicate-exports.mjs

      - name: Test
        run: npm run test

      - name: Install dependencies
        run: npm ci

      - name: Bundle size report
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
