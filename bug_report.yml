name: "🐞 Bug Report"
description: "Create a report to help us improve."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thank you for taking the time to fill out this bug report!"

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Reproduction"
      description: "Please provide a link to a minimal reproduction repository or a code snippet that reproduces the issue."
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: "stellar-hooks version"
      description: "Which version of `stellar-hooks` are you using?"
      placeholder: "e.g. 1.0.0"